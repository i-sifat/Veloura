name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'phase/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate content and clean sources
        run: |
          python3 tools/generate_phase3_content.py
          python3 tools/enrich_phase3_content.py
          python3 tools/fix_phase3_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Commit resolved Phase 3 state
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/phase/')
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pubspec.lock lib/features/truth_dare/presentation/truth_dare_screen.dart lib/features/*/data/*_seed.json docs/planning/PHASE3_CONTENT_QA.md
            git commit -m 'fix(core-content): resolve dependencies and source warnings'
            git push
          fi
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: veloura-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
