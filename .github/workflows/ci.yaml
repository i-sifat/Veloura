name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'phase/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Validate committed Phase 3 content
        run: |
          python3 tools/generate_phase3_content.py
          python3 tools/enrich_phase3_content.py
          python3 tools/fix_phase3_sources.py
          git diff --exit-code -- lib/features/*/data/*_seed.json docs/planning/PHASE3_CONTENT_QA.md lib/features/truth_dare/presentation/truth_dare_screen.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        id: pubget
        continue-on-error: true
        run: flutter pub get >pub_get.log 2>&1

      - name: Commit Phase 6 lockfile
        if: github.ref_name == 'phase/06-premium-monetization' || github.head_ref == 'phase/06-premium-monetization'
        run: |
          if git diff --quiet -- pubspec.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore(deps): resolve RevenueCat packages"
          git push origin HEAD:phase/06-premium-monetization

      - name: Report dependency resolution failure
        if: steps.pubget.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('pub_get.log', 'utf8').split('\n').slice(-80).join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Dependency resolution failed:\n\n\`\`\`text\n${tail}\n\`\`\``});

      - name: Stop after dependency failure
        if: steps.pubget.outcome == 'failure'
        run: cat pub_get.log && exit 1

      - name: Verify dependency lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Generate Dart source
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze >analyze.log 2>&1

      - name: Report analyzer failure
        if: steps.analyze.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('analyze.log', 'utf8').split('\n').slice(-160).join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Analyzer failed:\n\n\`\`\`text\n${tail}\n\`\`\``});

      - name: Stop after analyzer failure
        if: steps.analyze.outcome == 'failure'
        run: cat analyze.log && exit 1

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test >test.log 2>&1

      - name: Report test failure
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('test.log', 'utf8').split('\n').slice(-200).join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Tests failed:\n\n\`\`\`text\n${tail}\n\`\`\``});

      - name: Stop after test failure
        if: steps.test.outcome == 'failure'
        run: cat test.log && exit 1

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: veloura-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
