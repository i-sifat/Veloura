name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'phase/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        id: pubget
        continue-on-error: true
        run: flutter pub get >pub_get.log 2>&1

      - name: Report dependency resolution failure
        if: steps.pubget.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('pub_get.log', 'utf8');
            const tail = log.split('\n').slice(-80).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Dependency resolution failed:\n\n\`\`\`text\n${tail}\n\`\`\``,
            });

      - name: Stop after dependency failure
        if: steps.pubget.outcome == 'failure'
        run: |
          cat pub_get.log
          exit 1

      - name: Generate source
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
