name: Update Phase 6 lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - phase/06-premium-monetization
    paths:
      - pubspec.yaml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/06-premium-monetization
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore(deps): resolve RevenueCat packages"
          git push
