name: Refresh Phase 5 lockfile

on:
  push:
    branches:
      - phase/05-daily-challenge
    paths:
      - pubspec.yaml
      - .github/workflows/update_phase5_lock.yaml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-daily-challenge
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore(deps): resolve daily notification packages"
          git push origin HEAD:phase/05-daily-challenge
