name: Apply Phase 5 analyzer fixes

on:
  push:
    branches:
      - phase/05-daily-challenge
    paths:
      - .github/workflows/fix_phase5_analyzer.yaml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-daily-challenge
          fetch-depth: 0
      - name: Apply focused source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/daily/presentation/daily_screen.dart')
          text = path.read_text()
          text = text.replace("import 'package:veloura/shared/widgets/empty_state.dart';\n", '')
          text = text.replace("          const Row(\n            children: [\n              for (final label in ['M', 'T', 'W', 'T', 'F', 'S', 'S'])", "          Row(\n            children: [\n              for (final label in ['M', 'T', 'W', 'T', 'F', 'S', 'S'])")
          path.write_text(text)
          Path('.github/workflows/fix_phase5_analyzer.yaml').unlink()
          PY
      - name: Commit fixes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/daily/presentation/daily_screen.dart .github/workflows/fix_phase5_analyzer.yaml
          git commit -m "fix(daily): resolve analyzer findings"
          git push origin HEAD:phase/05-daily-challenge
