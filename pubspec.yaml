name: veloura
description: A private, playful couples app for connection and shared experiences.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^19.5.0
  flutter_riverpod: 3.0.3
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  json_annotation: ^4.9.0
  lottie: ^3.5.1
  purchases_flutter: ^8.11.0
  riverpod_annotation: 3.0.3
  sensors_plus: ^6.1.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.10.1

dev_dependencies:
  build_runner: 2.7.2
  custom_lint: ^0.8.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.3
  hive_ce_generator: 1.9.5
  json_serializable: 6.11.2
  riverpod_generator: 3.0.3
  riverpod_lint: 3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/Positions/
    - assets/lustful_rolls.png
    - assets/card_challenge.png
    - assets/truth_dare.png
    - assets/creative_positions.png
    - assets/follow_tempo.png
    - assets/passionate_roleplay.png
    - lib/features/truth_dare/data/truth_dare_seed.json
    - lib/features/cards/data/challenge_seed.json
    - lib/features/conversation/data/conversation_seed.json
    - lib/features/roleplay/data/roleplay_seed.json
